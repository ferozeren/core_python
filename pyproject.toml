[project]
name = "core-python"
version = "0.1.0"
description = "Core Python"
readme = "README.md"
authors = [{ name = "ferozeren", email = "ferozeren@proton.me" }]
requires-python = ">=3.12"

[project.scripts]
core-python = "core_python:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ipykernel>=7.4.0"]
